'use strict';
const DATA=JSON.parse(document.getElementById('itinerary-data').textContent);
const $=s=>document.querySelector(s);
const arr=x=>Array.isArray(x)?x:(x===undefined||x===null||x===''?[]:[x]);
const plain=x=>x&&typeof x==='object'&&!Array.isArray(x)?String(x.zh??x.en??''):String(x??'');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=x=>{try{const u=new URL(String(x));return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}};
const getSaved=(k,d)=>{try{return localStorage.getItem('nz-itinerary-'+k)??d}catch{return d}};
const save=(k,v)=>{try{localStorage.setItem('nz-itinerary-'+k,String(v))}catch{}};
const meta=DATA.meta||{},budget=DATA.budget||{},routes=DATA.routes||[],hotels=DATA.hotels||[];
const travelers=Number(budget.travelers)>0?Number(budget.travelers):3;
let language=getSaved('language','zh');if(!['zh','both'].includes(language))language='zh';
const defaultRoute=routes.some(r=>r.id===meta.defaultRoute)?meta.defaultRoute:routes[0].id;
let routeId=getSaved('route',defaultRoute);if(!routes.some(r=>r.id===routeId))routeId=defaultRoute;
let rate=Number(getSaved('rate',budget.exchangeRate||3.8));if(!(rate>0))rate=3.8;
let cityFilter=getSaved('city','all'),bedFilter=getSaved('bed','all');
const hotelMap=new Map(hotels.map(h=>[String(h.id),h]));
const fixed=(zh,en)=>language==='both'?`${esc(zh)}<span class="en">${esc(en)}</span>`:esc(zh);
function text(x){if(x===undefined||x===null)return '';if(typeof x==='object'&&!Array.isArray(x)){const zh=String(x.zh??x.en??''),en=String(x.en??'');return esc(zh)+(language==='both'&&en&&en!==zh?`<span class="en">${esc(en)}</span>`:'')}return esc(x)}
const present=x=>plain(x).trim()!=='';
function link(url,label,cls=''){const safe=safeUrl(url);return safe?`<a href="${esc(safe)}" target="_blank" rel="noopener noreferrer"${cls?` class="${esc(cls)}"`:''}>${label}<span aria-hidden="true"> ↗</span></a>`:label}
const list=(xs,cls)=>arr(xs).length?`<ul class="${cls||''}">${arr(xs).map(x=>`<li>${text(x)}</li>`).join('')}</ul>`:'';
const currency=c=>String(c||'NZD').toUpperCase()==='RMB'?'CNY':String(c||'NZD').toUpperCase();
const num=(n,d=0)=>Number(n).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d});
const amount=(n,c)=>`${currency(c)} ${num(n,meta.currentPlan?2:Number(n)%1?2:0)}`;
function cny(n,c){c=currency(c);if(c==='CNY')return Number(n);if(c==='NZD')return Number(n)*rate;const r=Number((budget.exchangeRates||{})[c]);return r>0?Number(n)*r:null}
function approx(n,c){const v=cny(n,c);return v===null||currency(c)==='CNY'?'':`≈ ¥${num(v)}`}
function dateLabel(s){const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${Number(m[2])}/${Number(m[3])}`:String(s||'')}
function weekday(s){const d=new Date(String(s)+'T12:00:00Z');return Number.isNaN(d.valueOf())?'':['周日','周一','周二','周三','周四','周五','周六'][d.getUTCDay()]}
function nights(q){if(q.nights!==undefined)return q.nights;const a=Date.parse(q.checkIn),b=Date.parse(q.checkOut);return Number.isFinite(a)&&Number.isFinite(b)&&b>a?Math.round((b-a)/86400000):null}
const mapsSearch=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const bedLabels={three_single:['3 张独立床','Three separate beds'],bunk:['独立铺位 / 上下铺','Individual bunk beds'],shared_double:['含共用大床','Includes a shared double'],unknown:['床型待确认','Bed setup unverified']};
function bedLabel(h){return h.bedLabel||{zh:(bedLabels[h.bedTier]||bedLabels.unknown)[0],en:(bedLabels[h.bedTier]||bedLabels.unknown)[1]}}
function inventory(h){const i=typeof h.inventory==='object'?h.inventory:{label:h.inventory},status=String(i.status||'unverified');const names={confirmed:['订单已确认','Booking confirmed'],available:['目标日期有房 · 查询快照','Available at check time'],live:['目标日期有房 · 查询快照','Available at check time'],limited:['余量有限 · 查询快照','Limited at check time'],sold_out:['目标日期无房','Sold out for target dates'],'sold-out':['目标日期无房','Sold out for target dates'],request:['需向酒店询价','Enquire directly'],unverified:['目标日期库存未核实','Exact-date availability unverified']};const name=names[status]||names.unverified;return `<span class="inventory ${status==='confirmed'?'available':esc(status)}">${i.label?text(i.label):fixed(...name)}</span>${i.checkedAt?`<div class="inventory-detail">${fixed('查询时间','Checked')} · ${text(i.checkedAt)}</div>`:''}${i.evidence?`<div class="inventory-detail">${text(i.evidence)}</div>`:''}`}
function quote(q,h){
 const numeric=q.amount!==null&&q.amount!==undefined&&Number.isFinite(Number(q.amount)),estimate=q.status==='estimate'||q.isFrom===true||q.priceType==='from',n=nights(q),c=currency(q.currency),guests=q.adults??q.guests;
 const details=[q.roomType?text(q.roomType):'',q.rooms!==undefined?`${text(q.rooms)} ${fixed('间 / 套','room(s)')}`:'',guests!==undefined?`${text(guests)} ${fixed('成人','adult(s)')}`:fixed('人数未列明','Guest count unlisted'),n!==null?`${esc(n)} ${fixed('晚','night(s)')}`:''].filter(Boolean).join(' · ');
 return `<div class="hotel-quote">${availabilityBadge(q)}<div class="quote-status ${estimate?'estimate':''}" style="margin-top:8px">${q.bookingStatus==='confirmed'||q.status==='confirmed'?fixed('已确认住宿 · 付款状态另列','Confirmed stay · payment shown separately'):estimate?fixed('参考估算 / 非日期起价 · 不用于当天房价','Reference estimate / undated from-price · excluded from daily rates'):numeric?fixed('已观察报价 · 非预订确认','Observed quote · not a reservation'):fixed('房型候选 · 尚无目标日期报价','Room candidate · no exact-date quote')}</div>${numeric?`<div class="quote-price"><strong>${esc(amount(q.amount,c))}</strong><span>${esc(approx(q.amount,c))}</span></div>`:''}<div class="quote-dates">${text(q.totalLabel||{zh:'所列整段总价，须核对人数、税费与退改',en:'Listed stay total; check guests, taxes and cancellation'})}</div>${q.checkIn||q.checkOut?`<div class="quote-meta">${esc(dateLabel(q.checkIn))} → ${esc(dateLabel(q.checkOut))}${details?' · '+details:''}</div>`:`<div class="quote-meta">${details}</div>`}${q.routeId?`<div class="quote-meta">${fixed('对应方案','Route')} · ${esc(q.routeId)}</div>`:''}${q.beds||q.bedEvidence?`<div class="quote-meta">${text(q.beds||q.bedEvidence)}</div>`:''}${q.taxes?`<div class="quote-meta">${text(q.taxes)}</div>`:''}${q.prepayment?`<div class="quote-cancel">${fixed('付款','Payment')} · ${text(q.prepayment)}</div>`:''}<div class="quote-cancel">${fixed('退改','Cancellation')} · ${text(q.cancellation||{zh:'未核实',en:'Unverified'})}</div>${q.evidence||q.inventoryNote||q.note?`<div class="quote-meta">${[q.evidence,q.inventoryNote,q.note,q.rateConditions&&q.rateConditions.note,q.roomSelectionInstruction,...arr(q.paymentCaveats)].filter(present).map(x=>text(x)).join('<br>')}</div>`:''}${q.observedAt?`<div class="quote-meta">${meta.currentPlan?fixed('资料更新','Details updated'):fixed('价格观察','Price observed')} · ${text(q.observedAt)}</div>`:''}${safeUrl(q.bookingUrl||q.url||h.bookingUrl||h.url)?link(q.bookingUrl||q.url||h.bookingUrl||h.url,meta.currentPlan?fixed('查看已选住宿','View selected accommodation'):fixed('直接查房 / 订房','Check / book directly'),'quote-link'):''}</div>`;
}
function flightLeg(l,type){if(!l)return '';return `<div class="flight-leg"><div class="leg-top"><span>${type==='out'?fixed('去程','Outbound'):fixed('返程','Return')} · ${esc(dateLabel(l.date))}</span><span>${l.arrivalDate&&l.arrivalDate!==l.date?fixed('抵达','Arrive')+' '+esc(dateLabel(l.arrivalDate)):''}</span></div><div class="leg-main"><div class="leg-place"><div class="leg-time">${text(l.departTime||'—')}</div><div class="leg-airport">${text(l.from)}</div></div><div class="leg-arrow">→</div><div class="leg-place"><div class="leg-time">${text(l.arrivalTime||'—')}</div><div class="leg-airport">${text(l.to)}</div></div></div>${l.via?`<div class="leg-via">${fixed('经停 / 转机','Via')} · ${text(l.via)}</div>`:''}${l.note?`<div class="fine" style="margin-top:7px">${text(l.note)}</div>`:''}</div>`}
function renderFlights(){const fs=arr(DATA.flights);if(!fs.length)return '';return `<section class="section" id="flights"><div class="section-heading"><div><div class="section-kicker">FLIGHT SNAPSHOT</div><h2>${fixed('先对齐三个人的航班','Align the three travellers’ flights')}</h2><p class="section-caption">${fixed('以下为提供的航班信息与截图报价，购买状态单独标明。','Provided flight details and screenshot quotes; purchase status is shown separately.')}</p></div></div><div class="flight-grid">${fs.map(f=>{const q=f.quote||{},numeric=q.amount!==undefined&&q.amount!==null&&Number.isFinite(Number(q.amount));return `<article class="card"><div class="flight-title"><h3>${text(f.origin)} · ${esc(f.travelers??f.travellers??'—')} ${fixed('人','traveller(s)')}</h3><span class="flight-status">${text(f.bookingStatus||{zh:'购买状态待确认',en:'Purchase status unconfirmed'})}</span></div>${flightLeg(f.outbound,'out')}${flightLeg(f.return,'return')}${numeric?`<div class="flight-price"><strong>${esc(amount(q.amount,q.currency||'CNY'))}</strong><span class="label">${text(q.basis||{zh:'每人报价，计价范围需核实',en:'Per-person quote; basis needs checking'})}</span><span class="label">${q.status==='estimate'?fixed('规划估算','Estimate'):fixed('截图 / 观察报价','Observed quote')}</span></div>${q.observedAt?`<div class="fine">${fixed('来源时间','Observed')} · ${text(q.observedAt)}</div>`:''}${q.cancellation?`<div class="fine">${fixed('退改','Cancellation')} · ${text(q.cancellation)}</div>`:''}${q.note?`<div class="fine">${text(q.note)}</div>`:''}`:''}${list(f.notes,'note-list')}${f.url?link(f.url,fixed('航班依据','Flight source'),'quote-link'):''}</article>`}).join('')}</div>${meta.flightNote?`<p class="block-note">${text(meta.flightNote)}</p>`:''}</section>`}

function quoteAvailability(q){
 const a=q.availability,raw=typeof a==='object'&&a?a.status:typeof a==='string'?a:q.inventoryStatus||q.status;
 const v=String(raw||'unverified').toLowerCase().replace(/-/g,'_'),reason=q.availabilityReason||(typeof a==='object'&&a?a.reason:'');
 const restriction=['minimum_stay','room_mismatch','occupancy_limit','maximum_stay','closed_to_arrival','closed_to_departure','rate_restriction'].includes(reason);
 const status=restriction||v==='unavailable'?'unavailable':['available','live','limited','confirmed'].includes(v)?'available':['sold_out','soldout','no_availability'].includes(v)?'sold_out':'unverified';
 const label=(q.bookingStatus==='confirmed'||v==='confirmed')?{zh:'订单已确认',en:'Booking confirmed'}:typeof a==='object'&&a?a.label:q.availabilityLabel||q.statusLabel;
 return {status,label,reason};
}
function availabilityBadge(q){
 const a=quoteAvailability(q),n=nights(q),minimum=q.minimumStay??q.minStay;
 const labels={available:['目标日期有房 · 查询快照','Available at query time'],sold_out:['目标日期满房 · 查询结果','Sold out for these dates'],unavailable:['该入住组合不可订','This stay combination cannot be booked'],unverified:['目标日期库存未核实','Exact-date availability unverified']};
 let special='';if(a.reason==='minimum_stay')special=fixed(`该${n!==null?n:''}晚组合不可订${minimum?`（至少${minimum}晚）`:'（有最少连住限制）'}`,`This ${n!==null?n+'-night ':''}stay cannot be booked${minimum?`; minimum ${minimum} nights`:'; minimum-stay restriction'}`);
 else if(a.reason==='room_mismatch')special=fixed('该房型不满足本次入住条件','This room does not meet the requested stay setup');
 else if(a.reason==='occupancy_limit')special=fixed('该入住人数组合不可订','This guest-count combination cannot be booked');
 else if(a.reason==='closed_to_arrival')special=fixed('该入住日不接受到店','Arrival is restricted on this date');
 else if(a.reason==='closed_to_departure')special=fixed('该退房日不可选','Departure is restricted on this date');
 return `<span class="inventory ${a.status}">${special|| (a.label?text(a.label):fixed(...labels[a.status]))}</span>`;
}
function isoDate(x){return /^\d{4}-\d{2}-\d{2}$/.test(String(x||''))?String(x):''}
function nextDate(x){const d=new Date(x+'T12:00:00Z');if(Number.isNaN(d.valueOf()))return '';d.setUTCDate(d.getUTCDate()+1);return d.toISOString().slice(0,10)}
function hotelStay(r,index,hotelId){const ds=arr(r.days),has=i=>arr(ds[i]&&ds[i].hotelIds).some(id=>String(id)===String(hotelId));let first=index,last=index;while(first>0&&has(first-1)&&nextDate(ds[first-1].date)===ds[first].date)first--;while(last+1<ds.length&&has(last+1)&&nextDate(ds[last].date)===ds[last+1].date)last++;const checkIn=isoDate(ds[first].date),checkOut=nextDate(ds[last].date),n=checkIn&&checkOut?Math.round((Date.parse(checkOut)-Date.parse(checkIn))/86400000):last-first+1;return {checkIn,checkOut,nights:n,first,last,repeat:index>first};}
function matchingQuotes(h,r,stay){return arr(h.quotes).filter(q=>{const ids=q.routeId!==undefined?arr(q.routeId):arr(q.routeIds);return (!ids.length||ids.map(String).includes(String(r.id)))&&isoDate(q.checkIn)===stay.checkIn&&isoDate(q.checkOut)===stay.checkOut;});}
function isRealDateQuote(q){return q.status!=='estimate'&&q.isFrom!==true&&q.priceType!=='from'&&q.isTargetQuote!==false&&q.amount!==null&&q.amount!==undefined&&Number.isFinite(Number(q.amount))&&Number(q.amount)>=0;}
function dailyQuote(q,h,stay,r){
 const a=quoteAvailability(q),adults=Number(q.adults??q.guests),partyOkay=Number.isFinite(adults)&&adults===travelers;
 const realPrice=isRealDateQuote(q)&&!['sold_out','unavailable'].includes(a.status)&&partyOkay,c=currency(q.currency),converted=realPrice?cny(q.amount,c):null;
 const prefix=c==='CNY'&&!q.isCurrencyConverted?'':'≈ ',n=stay.nights,rooms=q.rooms;
 const scope=[q.occupancyConfirmed===false?fixed('3成人目标；三成人结果未返回','3 adults requested; occupancy result unverified'):Number.isFinite(adults)&&adults>0?`${esc(adults)} ${fixed('成人','adults')}`:fixed('报价人数未列明','Quoted guest count unlisted'),rooms!==undefined?`${text(rooms)} ${fixed('间 / 套','room(s)')}`:fixed('间数未列明','Room count unlisted')].join(' · ');
 const price=realPrice?converted!==null?`<div class="daily-price"><strong>${esc(prefix)}¥ ${num(converted,2)}</strong><span>${q.quoteStage==='request_review'?fixed('申请预订三人整段价','Request-to-book total for three'):q.quoteStage==='list_only'?fixed('列表三人整段参考价','Search-list reference total for three'):q.isCurrencyConverted?fixed('三人整段平台换算价','Converted platform total for three'):fixed('整段三人总价','Total for three, entire stay')}</span></div><div class="daily-price-sub">${c!=='CNY'?esc(amount(q.amount,c))+' · ':''}${esc(n)} ${fixed('晚合计','nights total')}${q.taxes?' · '+text(q.taxes):' · '+fixed('税费范围未核实','Tax inclusion unverified')}</div><div class="daily-cost-grid"><div><span>${fixed('每晚全组','Whole group / night')}</span><strong>${esc(prefix)}¥ ${num(converted/n,2)}</strong></div><div><span>${fixed('每人整段','Per person / entire stay')}</span><strong>${esc(prefix)}¥ ${num(converted/travelers,2)}</strong></div><div><span>${fixed('每人每晚','Per person / night')}</span><strong>${esc(prefix)}¥ ${num(converted/travelers/n,2)}</strong></div></div>`:`<div class="daily-price"><strong>${esc(amount(q.amount,c))}</strong><span>${fixed('整段原币总价','Original total for entire stay')}</span></div><p class="daily-pending">${fixed('此币种尚无人民币换算假设。','No CNY conversion assumption supplied for this currency.')}</p>`:`<div class="daily-pending">${a.status==='sold_out'?fixed('本入住段暂无可售报价。','No bookable quote for this stay.'):a.status==='unavailable'?fixed('此日期、人数或连住组合不符合当前订房条件，见状态原因。','This date, guest-count or stay-length combination does not meet the current booking conditions; see the status reason.'):!partyOkay&&isRealDateQuote(q)?fixed('查询人数与本次三人未对齐，三人总价未核实。','Guest count does not confirm this party of three; no three-person total verified.'):fixed('尚未取得本入住段的可核验总价。','No verified exact-date total for this stay yet.')}</div>`;
 return `<div class="daily-rate">${availabilityBadge(q)}${q.sourceLabel?`<div class="fine">${text(q.sourceLabel)}</div>`:''}<div class="daily-scope">${scope}${q.roomType?' · '+text(q.roomType):''}</div>${q.beds?`<div class="daily-queried-beds">${meta.currentPlan?fixed('床型','Beds'):fixed('查询房型床型','Beds in quoted room')} · ${text(q.beds)}</div>`:''}${price}${n>1?`<div class="daily-repeat">${fixed('连住','Continuous stay')} ${esc(n)} ${fixed('晚；相邻日期展示同一整段报价，不是每天重复收取。','nights; adjacent daily cards repeat this same whole-stay quote, not another charge.')}</div>`:''}<div class="daily-terms">${q.prepayment?`<div><span>${fixed('付款','Payment')}</span>${text(q.prepayment)}</div>`:''}${q.breakfast?`<div><span>${fixed('早餐','Breakfast')}</span>${text(q.breakfast)}</div>`:''}<div><span>${fixed('退改','Cancellation')}</span>${text(q.cancellation||{zh:'未核实',en:'Unverified'})}</div><div><span>${fixed('更新','Updated')}</span>${text(q.observedAt||{zh:'未取得目标日期查询时间',en:'No exact-date query time supplied'})}</div></div>${q.evidence||q.inventoryNote||q.note?`<details class="daily-fact-notes"><summary>${meta.currentPlan?fixed('住宿确认依据','Stay confirmation basis'):fixed('价格与房态核查依据','Rate and availability evidence')}</summary><p class="daily-evidence">${[q.evidence,q.inventoryNote,q.note,q.rateConditions&&q.rateConditions.note,q.roomSelectionInstruction,...arr(q.paymentCaveats)].filter(present).map(x=>text(x)).join('<br>')}</p></details>`:''}<div class="link-row daily-booking">${link(q.bookingUrl||q.url||h.bookingUrl||h.url,h.comfortShortlist?fixed('Airbnb 看照片 / 查当日价格','Airbnb photos / dated rates'):meta.currentPlan?fixed('查看已选住宿','View selected accommodation'):fixed('直接查房 / 订房','Check / book this stay'),'link-button booking-primary')}${link(h.mapsUrl||mapsSearch([plain(h.name),plain(h.city),'New Zealand'].join(' ')),fixed('地图','Map'),'link-button')}</div>${q.requiresDateSelection?`<p class="fine">${fixed('此订房系统不保存完整日期；打开后按上方日期、3成人重新选择。','This booking system does not retain the full search; reselect the dates above and 3 adults.')}</p>`:''}</div>`;
}

function renderParkingCost(cost,showTitle=true){
 if(!cost||typeof cost!=='object'||Array.isArray(cost))return '';
 const amount=Number(cost.amountNzd),valid=cost.amountNzd!==null&&cost.amountNzd!==undefined&&Number.isFinite(amount)&&amount>=0;const quantity=Number(cost.comparisonQuantity),hasComparison=valid&&cost.comparisonQuantity!==null&&cost.comparisonQuantity!==undefined&&Number.isFinite(quantity)&&quantity>0;const comparisonLabel=cost.comparisonLabel||{zh:`${num(quantity)}个计费单位合计`,en:`Total for ${num(quantity)} billing units`};
 return `<div class="hotel-parking-cost">${showTitle?`<h5>${fixed('住宿停车费用','Hotel parking cost')}</h5>`:''}<div class="hotel-parking-price">${valid?`<strong>NZ$ ${num(amount,amount%1?2:0)}</strong><span>≈ ¥ ${num(cny(amount,'NZD'),2)}</span>`:`<strong class="hotel-parking-pending">${fixed('停车费用待核','Parking charge unverified')}</strong>`}${cost.unit?`<small>${text(cost.unit)}</small>`:''}</div>${hasComparison?`<div class="hotel-parking-comparison"><span>${text(comparisonLabel)}</span><strong>NZ$ ${num(amount*quantity,(amount*quantity)%1?2:0)} <small>≈ ¥ ${num(cny(amount*quantity,'NZD'),2)}</small></strong></div>`:''}${cost.note?`<p>${text(cost.note)}</p>`:''}${safeUrl(cost.sourceUrl)?`<div class="hotel-parking-source">${link(cost.sourceUrl,fixed('停车费用依据','Parking charge source'))}</div>`:''}</div>`;
}
function renderHotelParkingSummary(){
 const info=meta.hotelParkingSummary;if(!info||typeof info!=='object'||Array.isArray(info))return '';const items=arr(info.items).filter(x=>x&&typeof x==='object');

function coreRowGroup(row){

 const groups=meta.currentPlan?[{id:'A',title:['主线湖区：Tekapo与Pukaki','Main-route lakes: Tekapo and Pukaki'],note:['12/29–31湖边连住，沿路慢慢看','Lakeside stay on 29–31 Dec, with relaxed stops']},{id:'B',title:['皇后镇与Glenorchy','Queenstown and Glenorchy'],note:['12/27–29，湖畔与小镇风景','27–29 Dec, lakeside and small-town landscapes']},{id:'shared',title:['晴天可选：库克山看景','Clear-day option: Aoraki views'],note:['替换12/30半天；不徒步','Replaces half of 30 Dec; no hiking']}]:[{id:'A',title:['A线独有：湖蓝与雪山','A only: turquoise lakes and mountains'],note:['Tekapo、Pukaki与Aoraki / Mount Cook方向','Tekapo, Pukaki and Aoraki / Mount Cook']},{id:'B',title:['B线独有：湖边慢拍与老镇','B only: lakeside scenes and heritage town'],note:['Wanaka与Cromwell，留出轻松拍照时间','Wanaka and Cromwell, with time for relaxed photography']},{id:'shared',title:['两线共有：皇后镇与峡湾','Both routes: Queenstown and fiords'],note:['皇后镇、Glenorchy与峡湾；Manapouri对A线是可选支线。','Queenstown, Glenorchy and Milford; Manapouri is an optional detour for A.']}];
 const card=p=>{const imageUrl=safeUrl(p.imageUrl),sourceUrl=safeUrl(p.sourceUrl),title=p.title||p.id||{zh:'景色参考',en:'Landscape reference'};const stops=arr(p.stops);const alt=[plain(title),...stops.map(plain)].filter(Boolean).join(' · ');return `<figure class="photo-card"${p.id?` id="photo-${esc(p.id)}"`:''}><a class="photo-image-link" href="${esc(imageUrl)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(alt+' · '+(language==='both'?'查看大图 / Open full image':'查看大图'))}"><img src="${esc(imageUrl)}" alt="${esc(alt)}" loading="lazy" decoding="async" width="${esc(p.width||960)}" height="${esc(p.height||600)}"></a><figcaption><h4>${text(title)}</h4>${stops.length?`<div class="photo-stops">${stops.map(x=>`<span>${text(x)}</span>`).join('')}</div>`:''}${p.caption?`<p class="photo-caption">${text(p.caption)}</p>`:''}${p.seasonNote?`<p class="photo-season"><strong>${fixed('季节参考','Season reference')} · </strong>${text(p.seasonNote)}</p>`:''}<p class="photo-credit">${fixed('摄影 / 图片来源','Photo / image source')} · ${text(p.credit||{zh:'见原始来源页',en:'See original source'})}</p><div class="photo-source">${link(imageUrl,fixed('大图','Full image'))}${sourceUrl?link(sourceUrl,fixed('来源','Source')):''}${p.licenseUrl?link(p.licenseUrl,fixed('图片许可','Image licence')):''}</div></figcaption></figure>`};
 const filters=meta.currentPlan?[{id:'all',label:['全部','All']},{id:'A',label:['主线湖区','Lakes']},{id:'B',label:['皇后镇','Queenstown']},{id:'shared',label:['可选看山','Optional mountains']}]:[{id:'all',label:['全部','All']},{id:'A',label:['A独有','A only']},{id:'B',label:['B独有','B only']},{id:'shared',label:['两线共有','Both']}];
 return `<section class="section" id="photo-album"><div class="section-heading"><div><div class="section-kicker">REAL LANDSCAPES</div><h2>${meta.currentPlan?fixed('这次会看到的景色','Landscapes for this trip'):fixed('先看景色，再比较A与B','See the landscapes, then compare A and B')}</h2></div></div><p class="photo-album-intro">${fixed('真实地点照片。手机可在每组左右滑动，点图看原比例大图；也可按路线筛选。季节与摄影信息随图保留，天气、花况和积雪以出行当天为准。','Real-place photographs. Swipe each group on your phone and tap for the full image, or filter by route. Credits and season notes remain with every photograph; weather, flowers and snow vary on your dates.')}</p><div class="photo-filter-bar" role="group" aria-label="${esc(language==='both'?'照片路线筛选 / Photo route filter':'照片路线筛选')}">${filters.map(f=>`<button class="photo-filter ${photoFilter===f.id?'active':''}" type="button" data-photo-filter="${f.id}" aria-pressed="${String(photoFilter===f.id)}">${fixed(...f.label)} <small>${f.id==='all'?photos.length:photos.filter(p=>photoScope(p)===f.id).length}</small></button>`).join('')}</div><p class="photo-filter-count" id="photo-filter-count" aria-live="polite">${photos.filter(p=>photoFilter==='all'||photoScope(p)===photoFilter).length} ${fixed('张实景照片','real-place photographs')}</p>${groups.map(g=>{const group=photos.filter(p=>photoScope(p)===g.id);return group.length?`<div class="photo-group" data-photo-scope="${g.id}"${photoFilter!=='all'&&photoFilter!==g.id?' hidden':''}><div class="photo-group-heading"><div><h3>${fixed(...g.title)} <small>· ${group.length}</small></h3><p>${fixed(...g.note)}</p></div><div class="photo-scroll-controls"><button type="button" data-photo-scroll="-1" data-photo-group="${g.id}" aria-label="${esc(language==='both'?'上一张 / Previous photograph':'上一张')}">←</button><button type="button" data-photo-scroll="1" data-photo-group="${g.id}" aria-label="${esc(language==='both'?'下一张 / Next photograph':'下一张')}">→</button></div></div><div class="photo-grid" tabindex="0" aria-label="${esc(plain({zh:g.title[0],en:g.title[1]})+' · '+(language==='both'?'左右滑动 / Swipe horizontally':'左右滑动'))}">${group.map(card).join('')}</div></div>`:''}).join('')}</section>`;

function renderSocialEvidence(evidence){
 if(!evidence||typeof evidence!=='object'||Array.isArray(evidence))return '';
 const notes=arr(evidence.notes).filter(n=>n&&typeof n==='object');const rawCount=Number(evidence.sampleCount);const count=Number.isFinite(rawCount)&&rawCount>=0?Math.floor(rawCount):notes.length;const positive=arr(evidence.positiveThemes),cautions=arr(evidence.cautions);const hasDetails=positive.length||cautions.length||notes.length;
 return `<section class="activity-social" aria-label="${esc(language==='both'?'小红书体验参考 / Xiaohongshu experience references':'小红书体验参考')}"><h4>${fixed(`小红书体验参考（${count}篇）`,`Xiaohongshu experience references (${count} posts)`)}</h4>${evidence.summary?`<p class="activity-social-summary">${text(evidence.summary)}</p>`:''}${hasDetails?`<details class="activity-social-details"><summary>${fixed('看体验要点、吐槽与原帖','View experience themes, cautions and posts')}</summary><div class="activity-social-themes">${positive.length?`<div><strong>${fixed('帖子提到的体验亮点','Highlights mentioned in posts')}</strong>${list(positive)}</div>`:''}${cautions.length?`<div class="activity-social-cautions"><strong>${fixed('吐槽与注意点','Complaints and cautions')}</strong>${list(cautions)}</div>`:''}</div>${notes.length?`<details class="activity-social-posts"><summary>${fixed(`展开${notes.length}篇原帖链接`,`Open ${notes.length} source posts`)}</summary><ul>${notes.map(n=>`<li><strong>${safeUrl(n.url)?link(n.url,text(n.title||{zh:'查看原帖',en:'Open original post'})):text(n.title||{zh:'原帖标题待补',en:'Post title pending'})}</strong><div class="activity-social-post-meta">${n.author?`<span>${fixed('作者','Author')} · ${text(n.author)}</span>`:''}${n.kind?`<span>${fixed('帖子类型','Post type')} · ${text(n.kind)}</span>`:''}${n.likes!==undefined&&n.likes!==null&&String(n.likes)!==''?`<span>${fixed('帖子互动 · 点赞','Post engagement · likes')} ${typeof n.likes==='number'?num(n.likes):text(n.likes)}</span>`:''}</div></li>`).join('')}</ul></details>`:''}</details>`:''}</section>`;
}
function renderSocialResearch(info){if(!info||typeof info!=='object'||Array.isArray(info))return '';return `<aside class="activity-social-research"><strong>${fixed('小红书体验采样','Xiaohongshu experience sampling')}${info.checkedAt?` · ${text(info.checkedAt)}`:''}</strong>${info.scopeNote?`<p>${text(info.scopeNote)}</p>`:''}${info.sampleNote?`<p>${text(info.sampleNote)}</p>`:''}</aside>`}

}

function renderActivityShortlist(entries,activities){const activityMap=new Map(activities.filter(a=>a&&a.id!==undefined).map(a=>[String(a.id),a]));const rows=arr(entries).filter(x=>x&&typeof x==='object'&&activityMap.has(String(x.activityId)));if(!rows.length)return '';return `<details class="activity-shortlist"><summary>${fixed(`快速找项目 · ${rows.length}个备选`,`Find an experience · ${rows.length} options`)}</summary><nav aria-label="${esc(language==='both'?'活动备选索引 / Experience shortlist':'活动备选索引')}"><ol>${rows.map(x=>{const activity=activityMap.get(String(x.activityId));return `<li><a href="#activity-${esc(encodeURIComponent(String(activity.id)))}">${text(activity.name||activity.title||activity.id)}<span aria-hidden="true"> ↓</span></a>${x.route||x.reason?`<p>${x.route?`<strong>${text(x.route)}</strong>`:''}${x.route&&x.reason?' · ':''}${x.reason?text(x.reason):''}</p>`:''}</li>`}).join('')}</ol></nav></details>`}

es and estimates are separate; totals include only the items listed.')}</p></div></div>${meta.budgetHeadline?`<p class="budget-headline">${text(meta.budgetHeadline)}</p>`:''}<div class="budget-control"><label class="rate-input">1 NZD = <input id="exchange-rate" type="number" inputmode="decimal" min="0.01" max="100" step="0.0001" value="${esc(rate)}" aria-label="新西兰元兑人民币规划汇率"> CNY</label><p>${text(meta.currencyNote||{zh:'这是可调整的规划汇率假设，不是实时结算汇率。修改后同步换算酒店与预算。',en:'An adjustable planning assumption, not a live settlement rate. Hotel and budget equivalents update together.'})}</p></div>${budget.note?`<p class="block-note">${text(budget.note)}</p>`:''}<div id="budget-content" aria-live="polite"></div></section>${arr(meta.bookingPriority).length?`<section class="section" id="next-steps"><div class="section-heading"><div><div class="section-kicker">BOOKING ORDER</div><h2>${fixed('接下来，按这个顺序确认','What to confirm next')}</h2></div></div><ol class="priority-list">${arr(meta.bookingPriority).map(p=>`<li><span>${text(p)}</span></li>`).join('')}</ol></section>`:''}${sources()}<footer class="footer">${text(meta.footerNote||{zh:'当前为旅行规划；预订前复核日期、人数、床型、税费与退改。',en:'A planning document. Recheck dates, guests, beds, taxes and cancellation before booking.'})}</footer><a class="jump-top" href="#top">${fixed('回到顶部 ↑','Back to top ↑')}</a>`;$('#lang-zh').classList.toggle('active',language==='zh');$('#lang-both').classList.toggle('active',language==='both');$('#lang-zh').setAttribute('aria-pressed',String(language==='zh'));$('#lang-both').setAttribute('aria-pressed',String(language==='both'));if(meta.currentPlan){const money=$('#budget'),photos=$('#photo-album'),activities=$('#activities'),stays=$('#hotels');let cursor=money;for(const section of [photos,activities,stays])if(section){cursor.after(section);cursor=section}}renderRoute();renderHotels()}
let dayObserver,stickyResizeObserver,observedDatebar,stickyFrame=0,lastStickyOffset=0;
function syncStickyMetrics(){const header=$('.topbar'),dates=$('.datebar');const headerHeight=Math.ceil(header?header.getBoundingClientRect().height:0),dateHeight=Math.ceil(dates?dates.getBoundingClientRect().height:0);const root=document.documentElement;root.style.setProperty('--header-height',headerHeight+'px');root.style.setProperty('--datebar-height',dateHeight+'px');const offset=headerHeight+dateHeight+14;const changed=offset!==lastStickyOffset;lastStickyOffset=offset;if('ResizeObserver' in window){if(!stickyResizeObserver){stickyResizeObserver=new ResizeObserver(()=>scheduleStickyLayout());if(header)stickyResizeObserver.observe(header)}if(dates!==observedDatebar){if(observedDatebar)stickyResizeObserver.unobserve(observedDatebar);observedDatebar=dates;if(dates)stickyResizeObserver.observe(dates)}}return changed}
function scheduleStickyLayout(){if(stickyFrame)return;stickyFrame=requestAnimationFrame(()=>{stickyFrame=0;if(syncStickyMetrics())observeDays()})}
function observeDays(){syncStickyMetrics();if(dayObserver)dayObserver.disconnect();if(!('IntersectionObserver' in window))return;dayObserver=new IntersectionObserver(entries=>{for(const e of entries)if(e.isIntersecting){document.querySelectorAll('.date-link').forEach(a=>a.classList.toggle('active',a.dataset.navDay===e.target.dataset.day))}},{rootMargin:'-'+lastStickyOffset+'px 0px -55% 0px',threshold:0});document.querySelectorAll('[data-day]').forEach(e=>dayObserver.observe(e));scheduleStickyLayout()}
window.addEventListener('resize',scheduleStickyLayout,{passive:true});window.addEventListener('orientationchange',scheduleStickyLayout,{passive:true});if(document.fonts&&document.fonts.ready)document.fonts.ready.then(scheduleStickyLayout);
document.addEventListener('click',e=>{const filter=e.target.closest('[data-photo-filter]');if(filter){setPhotoFilter(filter.dataset.photoFilter);return}const scroll=e.target.closest('[data-photo-scroll]');if(scroll){const group=document.querySelector('[data-photo-scope='+scroll.dataset.photoGroup+'] .photo-grid');if(group){const first=group.querySelector('.photo-card');group.scrollBy({left:Number(scroll.dataset.photoScroll)*((first?first.getBoundingClientRect().width:group.clientWidth)+16),behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}return}const b=e.target.closest('[data-route]');if(b){routeId=b.dataset.route;save('route',routeId);renderRoute();return}});
document.addEventListener('change',e=>{if(e.target.id==='city-filter'){cityFilter=e.target.value;save('city',cityFilter);renderHotels()}if(e.target.id==='bed-filter'){bedFilter=e.target.value;save('bed',bedFilter);renderHotels()}});
document.addEventListener('input',e=>{if(e.target.id==='exchange-rate'){const value=Number(e.target.value);if(value>0&&value<=100){rate=value;save('rate',rate);renderBudget();renderHotels();refreshActivityPrices();const r=routes.find(x=>x.id===routeId)||routes[0];const rentals=$('#route-detail .route-rentals');if(rentals)rentals.outerHTML=renderRentals(r);$('#day-list').innerHTML=arr(r.days).map((d,i)=>dayCard(d,i,r)).join('');observeDays()}}});
$('#lang-zh').addEventListener('click',()=>{language='zh';save('language',language);render()});$('#lang-both').addEventListener('click',()=>{language='both';save('language',language);render()});$('#print-button').addEventListener('click',()=>window.print());
let printOpen=[];window.addEventListener('beforeprint',()=>{printOpen=[...document.querySelectorAll('details')].map(d=>[d,d.open]);printOpen.forEach(([d])=>d.open=true)});window.addEventListener('afterprint',()=>printOpen.forEach(([d,o])=>d.open=o));
render();
</script>
