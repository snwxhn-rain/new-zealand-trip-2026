<script>
'use strict';
const DATA=JSON.parse(document.getElementById('itinerary-data').textContent);
const $=s=>document.querySelector(s);
const arr=x=>Array.isArray(x)?x:(x===undefined||x===null||x===''?[]:[x]);
const plain=x=>x&&typeof x==='object'&&!Array.isArray(x)?String(x.zh??x.en??''):String(x??'');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=x=>{try{const u=new URL(String(x));return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}};
const getSaved=(k,d)=>{try{return localStorage.getItem('nz-itinerary-'+k)??d}catch{return d}};
const save=(k,v)=>{try{localStorage.setItem('nz-itinerary-'+k,String(v))}catch{}};
const meta=DATA.meta||{},budget=DATA.budget||{},routes=DATA.routes||[],hotels=DATA.hotels||[];
const travelers=Number(budget.travelers)>0?Number(budget.travelers):3;
let language=getSaved('language','zh');if(!['zh','both'].includes(language))language='zh';
const defaultRoute=routes.some(r=>r.id===meta.defaultRoute)?meta.defaultRoute:routes[0].id;
let routeId=getSaved('route',defaultRoute);if(!routes.some(r=>r.id===routeId))routeId=defaultRoute;
let rate=Number(getSaved('rate',budget.exchangeRate||3.8));if(!(rate>0))rate=3.8;
let cityFilter=getSaved('city','all'),bedFilter=getSaved('bed','all');
const hotelMap=new Map(hotels.map(h=>[String(h.id),h]));
const fixed=(zh,en)=>language==='both'?`${esc(zh)}<span class="en">${esc(en)}</span>`:esc(zh);
function text(x){if(x===undefined||x===null)return '';if(typeof x==='object'&&!Array.isArray(x)){const zh=String(x.zh??x.en??''),en=String(x.en??'');return esc(zh)+(language==='both'&&en&&en!==zh?`<span class="en">${esc(en)}</span>`:'')}return esc(x)}
const present=x=>plain(x).trim()!=='';
function link(url,label,cls=''){const safe=safeUrl(url);return safe?`<a href="${esc(safe)}" target="_blank" rel="noopener noreferrer"${cls?` class="${esc(cls)}"`:''}>${label}<span aria-hidden="true"> ↗</span></a>`:label}
const list=(xs,cls)=>arr(xs).length?`<ul class="${cls||''}">${arr(xs).map(x=>`<li>${text(x)}</li>`).join('')}</ul>`:'';
const currency=c=>String(c||'NZD').toUpperCase()==='RMB'?'CNY':String(c||'NZD').toUpperCase();
const num=(n,d=0)=>Number(n).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d});
const amount=(n,c)=>`${currency(c)} ${num(n,Number(n)%1?2:0)}`;

function quoteAvailability(q){
 const a=q.availability,raw=typeof a==='object'&&a?a.status:typeof a==='string'?a:q.inventoryStatus||q.status;
 const v=String(raw||'unverified').toLowerCase().replace(/-/g,'_'),reason=q.availabilityReason||(typeof a==='object'&&a?a.reason:'');
 const restriction=['minimum_stay','room_mismatch','occupancy_limit','maximum_stay','closed_to_arrival','closed_to_departure','rate_restriction'].includes(reason);
 const status=restriction||v==='unavailable'?'unavailable':['available','live','limited'].includes(v)?'available':['sold_out','soldout','no_availability'].includes(v)?'sold_out':'unverified';

function coreRowGroup(row){
 if(row.complete===false)return null;const source=arr(row.sourceItems);if(!source.length)return row.groupCny===null||row.groupCny===undefined?null:Number(row.groupCny);

trong><p>${text(core.bedTradeoff.label)}；${fixed('同段房费','Same-stay room total')} ¥ ${num(core.bedTradeoff.lowerStayGroupCny,2)}，${fixed('平均可少','Average saving')} ¥ ${num(core.bedTradeoff.savingPerPersonCny,2)} / ${fixed('人','person')}。</p><p>${text(core.bedTradeoff.note)}</p></div>`:''}${list(core.notes,'note-list')}<p class="fine">${fixed('按当前规划汇率同步换算：1NZD＝','Recalculated at the planning exchange rate: 1NZD = ')}¥ ${num(rate,2)}；${fixed('报价快照均未预订，刷卡手续费、押金及最终付款条件再核。','Quote snapshots are unreserved; reconfirm card fees, deposit and final payment terms.')}</p></section><h3 class="all-budget-heading">${fixed('全项目规划：再包含餐饮、签证等预留','Full budget: including meals, visas and other allowances')}</h3><p class="all-budget-explainer">${fixed('下面保留原费用明细及全部规划预留，与上方核心合计采用不同范围。','The original detailed budget below includes all planning allowances and has a broader scope than the core total.')}</p>`;
}
function budgetRows(items){return `<div class="budget-table-wrap"><table class="budget-table"><thead><tr><th>${fixed('项目与依据','Item and basis')}</th><th class="basis-col">${fixed('原币 / 计价','Original / basis')}</th><th>${fixed('三人合计','Group total')}</th></tr></thead><tbody>${items.map(x=>{const a=Number(x.amount),q=x.quantity===undefined?1:Number(x.quantity),valid=x.amount!==null&&x.amount!==undefined&&Number.isFinite(a)&&a>=0&&Number.isFinite(q)&&q>=0,unit=valid?a*q:null,group=unit===null?null:unit*(x.scope==='per_person'?travelers:1),converted=group===null?null:cny(group,x.currency),basis=x.quantityLabel?text(x.quantityLabel):`${esc(q)} × ${x.scope==='per_person'?fixed('每人','per person'):fixed('全组','whole group')}`;const notes=[x.note?text(x.note):'',x.observedAt?fixed('观察时间','Observed')+' · '+text(x.observedAt):'',x.cancellation?fixed('退改','Cancellation')+' · '+text(x.cancellation):''].filter(Boolean).join('<br>');return `<tr><td><div class="budget-item-name">${text(x.name)}${x.origin?` <span class="fine">· ${text(x.origin)}</span>`:''}${x.optional?`<span class="optional-label">${fixed('可选 · 不计入合计','Optional · excluded')}</span>`:''}</div><div class="budget-item-note">${notes}${safeUrl(x.sourceUrl)?`${notes?'<br>':''}${link(x.sourceUrl,fixed('报价依据','Quote source'))}`:''}<div class="no-print" style="margin-top:4px">${valid?esc(amount(a,x.currency)):fixed('金额待补','Amount pending')} · ${basis}</div></div></td><td class="basis-col"><div class="budget-raw">${valid?esc(amount(a,x.currency)):fixed('待补','Pending')}</div><div class="fine">${basis}</div></td><td>${converted===null?fixed('未纳入','Excluded'):`¥ ${num(converted)}`}${x.optional?`<div class="fine">${fixed('可选金额','Optional cost')}</div>`:''}</td></tr>`}).join('')}</tbody></table></div>`}
function renderBudget(){if(!$('#budget-content'))return;const items=arr(budget.items).filter(x=>!x.routeIds||!arr(x.routeIds).length||arr(x.routeIds).includes(routeId));const observed=items.filter(x=>['observed','observed_quote'].includes(x.status)),estimated=items.filter(x=>!['observed','observed_quote'].includes(x.status));let obs=0,est=0,excluded=0;for(const x of items){if(x.optional)continue;const a=Number(x.amount),q=x.quantity===undefined?1:Number(x.quantity);if(x.amount===null||x.amount===undefined||!Number.isFinite(a)||a<0||!Number.isFinite(q)||q<0){excluded++;continue}const v=cny(a*q*(x.scope==='per_person'?travelers:1),x.currency);if(v===null){excluded++;continue}if(['observed','observed_quote'].includes(x.status))obs+=v;else est+=v}$('#budget-content').innerHTML=renderBCoreBudget()+(!items.length?`<div class="empty">${fixed('尚未提供当前方案的费用项目。','No cost items supplied for this route.')}</div>`:`<div class="budget-totals"><div class="total-card primary"><div class="total-label">${routeId==='compact'&&meta.bCoreBudget?fixed('全项目规划 / 人','Full planning budget / person'):excluded?fixed('已列费用小计 / 人','Listed subtotal / person'):fixed('规划合计 / 人','Planning total / person')}</div><strong>¥ ${num((obs+est)/travelers)}</strong><small>${fixed('三人小计','Group subtotal')} ¥ ${num(obs+est)} · ${excluded?fixed('缺价项目未计入','unpriced items excluded'):fixed('含估算','includes estimates')}</small></div><div class="total-card"><div class="total-label">${fixed('已观察报价 / 人','Observed quotes / person')}</div><strong>¥ ${num(obs/travelers)}</strong><small>${fixed('报价快照，均不等于已付款','Quote snapshots, not paid costs')}</small></div><div class="total-card"><div class="total-label">${fixed('尚属估算 / 人','Estimated allowance / person')}</div><strong>¥ ${num(est/travelers)}</strong><small>${fixed('需按实际订单替换','Replace with actual bookings')}</small></div></div>${observed.length?`<div class="budget-table-title">${fixed('已观察报价','Observed quotations')}<span>${fixed('三人','Group')} ¥ ${num(obs)}</span></div>${budgetRows(observed)}`:''}${estimated.length?`<div class="budget-table-title estimate" style="margin-top:18px">${fixed('规划估算','Planning allowances')}<span>${fixed('三人','Group')} ¥ ${num(est)}</span></div>${budgetRows(estimated)}`:''}${excluded?`<p class="budget-exclusions">${esc(excluded)} ${fixed('项因金额或汇率未提供而未计入合计。','item(s) excluded because an amount or exchange rate is missing.')}</p>`:''}${items.some(x=>x.optional)?`<p class="block-note">${fixed('可选项目展示金额，未计入上方合计。','Optional activities are shown but excluded from the totals above.')}</p>`:''}`);}
function sources(){const ss=arr(DATA.sources);return `<section class="section" id="sources"><div class="section-heading"><div><div class="section-kicker">SOURCES & CHECKS</div><h2>${fixed('原始依据，随手可查','Sources at hand')}</h2>${meta.sourcesNote?`<p class="section-caption">${text(meta.sourcesNote)}</p>`:''}</div></div>${ss.length?`<ul class="source-list">${ss.map(s=>`<li class="source-item"><strong>${link(s.url,text(s.title||s.url))}</strong>${s.note?`<p>${text(s.note)}</p>`:''}${s.accessedAt||s.type?`<div class="source-meta">${[s.type?text(s.type):'',s.accessedAt?fixed('查看时间','Accessed')+' · '+text(s.accessedAt):''].filter(Boolean).join(' · ')}</div>`:''}</li>`).join('')}</ul>`:`<div class="empty">${fixed('来源尚未补充。','Sources have not been supplied.')}</div>`}</section>`}
function render(){const title=meta.title||{zh:'新西兰 · 南岛自驾',en:'New Zealand · South Island road trip'};$('#app').innerHTML=`<section class="hero"><div class="hero-top"><div><div class="eyebrow">${text(meta.planVersion||'A SOUTH ISLAND JOURNEY')}</div><h1>${text(title)}</h1></div><span class="status-pill">${text(meta.statusNote||{zh:'规划草案 · 请核对预订状态',en:'Planning draft · check booking status'})}</span></div><p class="subtitle">${text(meta.subtitle||{zh:'三位女生，慢慢开、好好看。',en:'A considered road trip for three.'})}</p><div class="meta-line">${meta.dateRange?`<span>${text(meta.dateRange)}</span>`:''}<span>${text(meta.travelers||`${travelers} 人同行`)}</span>${meta.updatedAt?`<span>${fixed('更新','Updated')} · ${text(meta.updatedAt)}</span>`:''}</div>${meta.heroFacts?`<div class="facts">${arr(meta.heroFacts).map(f=>`<span class="pill">${text(f)}</span>`).join('')}</div>`:''}${meta.partyNote?`<div class="party-note">${text(meta.partyNote)}</div>`:''}${meta.intro?`<p class="lead">${text(meta.intro)}</p>`:''}${meta.recommendation?`<div class="recommendation">${meta.recommendation.title?`<strong>${text(meta.recommendation.title)}</strong>`:''}${meta.recommendation.detail?`<p>${text(meta.recommendation.detail)}</p>`:''}</div>`:''}${list(meta.notes,'note-list')}${arr(meta.platformCoverage).length?`<div class="platform-coverage">${arr(meta.platformCoverage).map(p=>`<div><strong>${text(p.name)}</strong><p>${text(p.detail)}</p></div>`).join('')}</div>`:''}</section>${renderFlights()}${meta.seasonNote?`<aside class="season-note"><strong>${fixed('跨年夏季怎么安排','Planning for midsummer and New Year')}</strong><p>${text(meta.seasonNote)}</p></aside>`:''}${arr(meta.assumptions).length?`<aside class="assumptions"><strong>${fixed('目前按这些假设规划','Working assumptions')}</strong>${list(meta.assumptions)}</aside>`:''}<section class="section" id="itinerary"><div class="section-heading"><div><div class="section-kicker">THE ROADBOOK</div><h2>${fixed('每天怎么走，一页看清','The daily roadbook')}</h2><p class="section-caption">${fixed('切换方案可比较动线；参考时刻默认收起。','Switch routes to compare the plan; reference times stay collapsed.')}</p></div></div><div class="route-switch" id="route-buttons" role="group" aria-label="路线方案"></div><div id="route-detail"></div><div class="print-route" id="print-route"></div><nav class="datebar" aria-label="日期导航"><div class="datebar-inner" id="date-links"></div></nav><div class="day-list" id="day-list"></div></section><section class="section" id="hotels"><div class="section-heading"><div><div class="section-kicker">STAY SHORTLIST</div><h2>${fixed('住宿房型资料库','Accommodation reference')}</h2><p class="section-caption">${fixed('每天已直接列出对应日期的酒店与订房入口；这里保留全部房型依据，供需要时参考。','Daily cards already show dated stays and booking links. This appendix preserves the full room references.')}</p></div></div><details class="hotel-appendix"><summary>${fixed('展开所有住宿与房型依据','Open all hotel and room references')}</summary><div class="filters" style="margin-top:16px"><label class="field-label">${fixed('城市','City')}<select id="city-filter" aria-label="按城市筛选"></select></label><label class="field-label">${fixed('床型','Bed setup')}<select id="bed-filter" aria-label="按床型筛选"></select></label></div><p class="hotel-count" id="hotel-count" aria-live="polite"></p><div class="hotel-grid" id="hotel-grid"></div></details></section><section class="section" id="budget"><div class="section-heading"><div><div class="section-kicker">THE MONEY PLAN</div><h2>${fixed('费用说清楚，花钱有顺序','A transparent spending plan')}</h2><p class="section-caption">${fixed('已观察报价与规划估算分开；合计仅包含下列项目。','Observed quotes and estimates are separate; totals include only the items listed.')}</p></div></div>${meta.budgetHeadline?`<p class="budget-headline">${text(meta.budgetHeadline)}</p>`:''}<div class="budget-control"><label class="rate-input">1 NZD = <input id="exchange-rate" type="number" inputmode="decimal" min="0.01" max="100" step="0.01" value="${esc(rate)}" aria-label="新西兰元兑人民币规划汇率"> CNY</label><p>${text(meta.currencyNote||{zh:'这是可调整的规划汇率假设，不是实时结算汇率。修改后同步换算酒店与预算。',en:'An adjustable planning assumption, not a live settlement rate. Hotel and budget equivalents update together.'})}</p></div>${budget.note?`<p class="block-note">${text(budget.note)}</p>`:''}<div id="budget-content" aria-live="polite"></div></section>${arr(meta.bookingPriority).length?`<section class="section" id="next-steps"><div class="section-heading"><div><div class="section-kicker">BOOKING ORDER</div><h2>${fixed('接下来，按这个顺序确认','What to confirm next')}</h2></div></div><ol class="priority-list">${arr(meta.bookingPriority).map(p=>`<li><span>${text(p)}</span></li>`).join('')}</ol></section>`:''}${sources()}<footer class="footer">${text(meta.footerNote||{zh:'当前为旅行规划；预订前复核日期、人数、床型、税费与退改。',en:'A planning document. Recheck dates, guests, beds, taxes and cancellation before booking.'})}</footer><a class="jump-top" href="#top">${fixed('回到顶部 ↑','Back to top ↑')}</a>`;$('#lang-zh').classList.toggle('active',language==='zh');$('#lang-both').classList.toggle('active',language==='both');$('#lang-zh').setAttribute('aria-pressed',String(language==='zh'));$('#lang-both').setAttribute('aria-pressed',String(language==='both'));renderRoute();renderHotels()}
let dayObserver;
function observeDays(){if(dayObserver)dayObserver.disconnect();if(!('IntersectionObserver' in window))return;dayObserver=new IntersectionObserver(entries=>{for(const e of entries)if(e.isIntersecting){document.querySelectorAll('.date-link').forEach(a=>a.classList.toggle('active',a.dataset.navDay===e.target.dataset.day))}},{rootMargin:'-145px 0px -62% 0px',threshold:0});document.querySelectorAll('[data-day]').forEach(e=>dayObserver.observe(e))}
document.addEventListener('click',e=>{const b=e.target.closest('[data-route]');if(b){routeId=b.dataset.route;save('route',routeId);renderRoute();return}});
document.addEventListener('change',e=>{if(e.target.id==='city-filter'){cityFilter=e.target.value;save('city',cityFilter);renderHotels()}if(e.target.id==='bed-filter'){bedFilter=e.target.value;save('bed',bedFilter);renderHotels()}});
document.addEventListener('input',e=>{if(e.target.id==='exchange-rate'){const value=Number(e.target.value);if(value>0&&value<=100){rate=value;save('rate',rate);renderBudget();renderHotels();const r=routes.find(x=>x.id===routeId)||routes[0];const rentals=$('#route-detail .route-rentals');if(rentals)rentals.outerHTML=renderRentals(r);$('#day-list').innerHTML=arr(r.days).map((d,i)=>dayCard(d,i,r)).join('');observeDays()}}});
$('#lang-zh').addEventListener('click',()=>{language='zh';save('language',language);render()});$('#lang-both').addEventListener('click',()=>{language='both';save('language',language);render()});$('#print-button').addEventListener('click',()=>window.print());
let printOpen=[];window.addEventListener('beforeprint',()=>{printOpen=[...document.querySelectorAll('details')].map(d=>[d,d.open]);printOpen.forEach(([d])=>d.open=true)});window.addEventListener('afterprint',()=>printOpen.forEach(([d,o])=>d.open=o));
render();
