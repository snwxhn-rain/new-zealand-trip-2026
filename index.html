function quoteAvailability(q){
 const a=q.availability,raw=typeof a==='object'&&a?a.status:typeof a==='string'?a:q.inventoryStatus||q.status;
 const v=String(raw||'unverified').toLowerCase().replace(/-/g,'_'),reason=q.availabilityReason||(typeof a==='object'&&a?a.reason:'');
 const restriction=['minimum_stay','room_mismatch','occupancy_limit','maximum_stay','closed_to_arrival','closed_to_departure','rate_restriction'].includes(reason);
 const status=restriction||v==='unavailable'?'unavailable':['available','live','limited','confirmed'].includes(v)?'available':['sold_out','soldout','no_availability'].includes(v)?'sold_out':'unverified';
 const label=(q.bookingStatus==='confirmed'||v==='confirmed')?{zh:'订单已确认',en:'Booking confirmed'}:typeof a==='object'&&a?a.label:q.availabilityLabel||q.statusLabel;

function isoDate(x){return /^\d{4}-\d{2}-\d{2}$/.test(String(x||''))?String(x):''}
function nextDate(x){const d=new Date(x+'T12:00:00Z');if(Number.isNaN(d.valueOf()))return '';d.setUTCDate(d.getUTCDate()+1);return d.toISOString().slice(0,10)}
function hotelStay(r,index,hotelId){const ds=arr(r.days),has=i=>arr(ds[i]&&ds[i].hotelIds).some(id=>String(id)===String(hotelId));let first=index,last=index;while(first>0&&has(first-1)&&nextDate(ds[first-1].date)===ds[first].date)first--;while(last+1<ds.length&&has(last+1)&&nextDate(ds[last].date)===ds[last+1].date)last++;const checkIn=isoDate(ds[first].date),checkOut=nextDate(ds[last].date),n=checkIn&&checkOut?Math.round((Date.parse(checkOut)-Date.parse(checkIn))/86400000):last-first+1;return {checkIn,checkOut,nights:n,first,last,repeat:index>first};}

function dailyHotels(d,index,r){

function landmarkUrl(value){
 const safe=safeUrl(value);if(!safe)return '';
 try{const u=new URL(safe);if(u.username||u.password)return '';if(/(^|\.)xiaohongshu\.com$|(^|\.)xhslink\.com$/i.test(u.hostname)){u.search='';u.hash='';}else{for(const key of [...u.searchParams.keys()]){if(/token|secret|authorization|signature|session|password|credential|^(sid|key|api_key|auth|code)$/i.test(key))u.searchParams.delete(key);}}return u.href;}catch{return '';}
}

function coreRowGroup(row){

 const groups=meta.currentPlan?[{id:'A',title:['主线湖区：Tekapo与Pukaki','Main-route lakes: Tekapo and Pukaki'],note:['12/29–31湖边连住，沿路慢慢看','Lakeside stay on 29–31 Dec, with relaxed stops']},{id:'B',title:['皇后镇与Glenorchy','Queenstown and Glenorchy'],note:['12/27–29，湖畔与小镇风景','27–29 Dec, lakeside and small-town landscapes']},{id:'shared',title:['晴天可选：库克山看景','Clear-day option: Aoraki views'],note:['替换12/30半天；不徒步','Replaces half of 30 Dec; no hiking']}]:[{id:'A',title:['A线独有：湖蓝与雪山','A only: turquoise lakes and mountains'],note:['Tekapo、Pukaki与Aoraki / Mount Cook方向','Tekapo, Pukaki and Aoraki / Mount Cook']},{id:'B',title:['B线独有：湖边慢拍与老镇','B only: lakeside scenes and heritage town'],note:['Wanaka与Cromwell，留出轻松拍照时间','Wanaka and Cromwell, with time for relaxed photography']},{id:'shared',title:['两线共有：皇后镇与峡湾','Both routes: Queenstown and fiords'],note:['皇后镇、Glenorchy与峡湾；Manapouri对A线是可选支线。','Queenstown, Glenorchy and Milford; Manapouri is an optional detour for A.']}];
 const card=p=>{const imageUrl=safeUrl(p.imageUrl),sourceUrl=safeUrl(p.sourceUrl),title=p.title||p.id||{zh:'景色参考',en:'Landscape reference'};const stops=arr(p.stops);const alt=[plain(title),...stops.map(plain)].filter(Boolean).join(' · ');return `<figure class="photo-card"${p.id?` id="photo-${esc(p.id)}"`:''}><a class="photo-image-link" href="${esc(imageUrl)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(alt+' · '+(language==='both'?'查看大图 / Open full image':'查看大图'))}"><img src="${esc(imageUrl)}" alt="${esc(alt)}" loading="lazy" decoding="async" width="${esc(p.width||960)}" height="${esc(p.height||600)}"></a><figcaption><h4>${text(title)}</h4>${stops.length?`<div class="photo-stops">${stops.map(x=>`<span>${text(x)}</span>`).join('')}</div>`:''}${p.caption?`<p class="photo-caption">${text(p.caption)}</p>`:''}${p.seasonNote?`<p class="photo-season"><strong>${fixed('季节参考','Season reference')} · </strong>${text(p.seasonNote)}</p>`:''}<p class="photo-credit">${fixed('摄影 / 图片来源','Photo / image source')} · ${text(p.credit||{zh:'见原始来源页',en:'See original source'})}</p><div class="photo-source">${link(imageUrl,fixed('大图','Full image'))}${sourceUrl?link(sourceUrl,fixed('来源','Source')):''}${p.licenseUrl?link(p.licenseUrl,fixed('图片许可','Image licence')):''}</div></figcaption></figure>`};
 const filters=meta.currentPlan?[{id:'all',label:['全部','All']},{id:'A',label:['主线湖区','Lakes']},{id:'B',label:['皇后镇','Queenstown']},{id:'shared',label:['可选看山','Optional mountains']}]:[{id:'all',label:['全部','All']},{id:'A',label:['A独有','A only']},{id:'B',label:['B独有','B only']},{id:'shared',label:['两线共有','Both']}];
 return `<section class="section" id="photo-album"><div class="section-heading"><div><div class="section-kicker">REAL LANDSCAPES</div><h2>${meta.currentPlan?fixed('这次会看到的景色','Landscapes for this trip'):fixed('先看景色，再比较A与B','See the landscapes, then compare A and B')}</h2></div></div><p class="photo-album-intro">${fixed('真实地点照片。手机可在每组左右滑动，点图看原比例大图；也可按路线筛选。季节与摄影信息随图保留，天气、花况和积雪以出行当天为准。','Real-place photographs. Swipe each group on your phone and tap for the full image, or filter by route. Credits and season notes remain with every photograph; weather, flowers and snow vary on your dates.')}</p><div class="photo-filter-bar" role="group" aria-label="${esc(language==='both'?'照片路线筛选 / Photo route filter':'照片路线筛选')}">${filters.map(f=>`<button class="photo-filter ${photoFilter===f.id?'active':''}" type="button" data-photo-filter="${f.id}" aria-pressed="${String(photoFilter===f.id)}">${fixed(...f.label)} <small>${f.id==='all'?photos.length:photos.filter(p=>photoScope(p)===f.id).length}</small></button>`).join('')}</div><p class="photo-filter-count" id="photo-filter-count" aria-live="polite">${photos.filter(p=>photoFilter==='all'||photoScope(p)===photoFilter).length} ${fixed('张实景照片','real-place photographs')}</p>${groups.map(g=>{const group=photos.filter(p=>photoScope(p)===g.id);return group.length?`<div class="photo-group" data-photo-scope="${g.id}"${photoFilter!=='all'&&photoFilter!==g.id?' hidden':''}><div class="photo-group-heading"><div><h3>${fixed(...g.title)} <small>· ${group.length}</small></h3><p>${fixed(...g.note)}</p></div><div class="photo-scroll-controls"><button type="button" data-photo-scroll="-1" data-photo-group="${g.id}" aria-label="${esc(language==='both'?'上一张 / Previous photograph':'上一张')}">←</button><button type="button" data-photo-scroll="1" data-photo-group="${g.id}" aria-label="${esc(language==='both'?'下一张 / Next photograph':'下一张')}">→</button></div></div><div class="photo-grid" tabindex="0" aria-label="${esc(plain({zh:g.title[0],en:g.title[1]})+' · '+(language==='both'?'左右滑动 / Swipe horizontally':'左右滑动'))}">${group.map(card).join('')}</div></div>`:''}).join('')}</section>`;

function renderSocialEvidence(evidence){
 if(!evidence||typeof evidence!=='object'||Array.isArray(evidence))return '';
 const notes=arr(evidence.notes).filter(n=>n&&typeof n==='object');const rawCount=Number(evidence.sampleCount);const count=Number.isFinite(rawCount)&&rawCount>=0?Math.floor(rawCount):notes.length;const positive=arr(evidence.positiveThemes),cautions=arr(evidence.cautions);const hasDetails=positive.length||cautions.length||notes.length;
 return `<section class="activity-social" aria-label="${esc(language==='both'?'小红书体验参考 / Xiaohongshu experience references':'小红书体验参考')}"><h4>${fixed(`小红书体验参考（${count}篇）`,`Xiaohongshu experience references (${count} posts)`)}</h4>${evidence.summary?`<p class="activity-social-summary">${text(evidence.summary)}</p>`:''}${hasDetails?`<details class="activity-social-details"><summary>${fixed('看体验要点、吐槽与原帖','View experience themes, cautions and posts')}</summary><div class="activity-social-themes">${positive.length?`<div><strong>${fixed('帖子提到的体验亮点','Highlights mentioned in posts')}</strong>${list(positive)}</div>`:''}${cautions.length?`<div class="activity-social-cautions"><strong>${fixed('吐槽与注意点','Complaints and cautions')}</strong>${list(cautions)}</div>`:''}</div>${notes.length?`<details class="activity-social-posts"><summary>${fixed(`展开${notes.length}篇原帖链接`,`Open ${notes.length} source posts`)}</summary><ul>${notes.map(n=>`<li><strong>${safeUrl(n.url)?link(n.url,text(n.title||{zh:'查看原帖',en:'Open original post'})):text(n.title||{zh:'原帖标题待补',en:'Post title pending'})}</strong><div class="activity-social-post-meta">${n.author?`<span>${fixed('作者','Author')} · ${text(n.author)}</span>`:''}${n.kind?`<span>${fixed('帖子类型','Post type')} · ${text(n.kind)}</span>`:''}${n.likes!==undefined&&n.likes!==null&&String(n.likes)!==''?`<span>${fixed('帖子互动 · 点赞','Post engagement · likes')} ${typeof n.likes==='number'?num(n.likes):text(n.likes)}</span>`:''}</div></li>`).join('')}</ul></details>`:''}</details>`:''}</section>`;
}
function renderSocialResearch(info){if(!info||typeof info!=='object'||Array.isArray(info))return '';return `<aside class="activity-social-research"><strong>${fixed('小红书体验采样','Xiaohongshu experience sampling')}${info.checkedAt?` · ${text(info.checkedAt)}`:''}</strong>${info.scopeNote?`<p>${text(info.scopeNote)}</p>`:''}${info.sampleNote?`<p>${text(info.sampleNote)}</p>`:''}</aside>`}

}

function renderActivityShortlist(entries,activities){const activityMap=new Map(activities.filter(a=>a&&a.id!==undefined).map(a=>[String(a.id),a]));const rows=arr(entries).filter(x=>x&&typeof x==='object'&&activityMap.has(String(x.activityId)));if(!rows.length)return '';return `<details class="activity-shortlist"><summary>${fixed(`快速找项目 · ${rows.length}个备选`,`Find an experience · ${rows.length} options`)}</summary><nav aria-label="${esc(language==='both'?'活动备选索引 / Experience shortlist':'活动备选索引')}"><ol>${rows.map(x=>{const activity=activityMap.get(String(x.activityId));return `<li><a href="#activity-${esc(encodeURIComponent(String(activity.id)))}">${text(activity.name||activity.title||activity.id)}<span aria-hidden="true"> ↓</span></a>${x.route||x.reason?`<p>${x.route?`<strong>${text(x.route)}</strong>`:''}${x.route&&x.reason?' · ':''}${x.reason?text(x.reason):''}</p>`:''}</li>`}).join('')}</ol></nav></details>`}

es and estimates are separate; totals include only the items listed.')}</p></div></div>${meta.budgetHeadline?`<p class="budget-headline">${text(meta.budgetHeadline)}</p>`:''}<div class="budget-control"><label class="rate-input">1 NZD = <input id="exchange-rate" type="number" inputmode="decimal" min="0.01" max="100" step="0.0001" value="${esc(rate)}" aria-label="新西兰元兑人民币规划汇率"> CNY</label><p>${text(meta.currencyNote||{zh:'这是可调整的规划汇率假设，不是实时结算汇率。修改后同步换算酒店与预算。',en:'An adjustable planning assumption, not a live settlement rate. Hotel and budget equivalents update together.'})}</p></div>${budget.note?`<p class="block-note">${text(budget.note)}</p>`:''}<div id="budget-content" aria-live="polite"></div></section>${arr(meta.bookingPriority).length?`<section class="section" id="next-steps"><div class="section-heading"><div><div class="section-kicker">BOOKING ORDER</div><h2>${fixed('接下来，按这个顺序确认','What to confirm next')}</h2></div></div><ol class="priority-list">${arr(meta.bookingPriority).map(p=>`<li><span>${text(p)}</span></li>`).join('')}</ol></section>`:''}${sources()}<footer class="footer">${text(meta.footerNote||{zh:'当前为旅行规划；预订前复核日期、人数、床型、税费与退改。',en:'A planning document. Recheck dates, guests, beds, taxes and cancellation before booking.'})}</footer><a class="jump-top" href="#top">${fixed('回到顶部 ↑','Back to top ↑')}</a>`;$('#lang-zh').classList.toggle('active',language==='zh');$('#lang-both').classList.toggle('active',language==='both');$('#lang-zh').setAttribute('aria-pressed',String(language==='zh'));$('#lang-both').setAttribute('aria-pressed',String(language==='both'));if(meta.currentPlan){const money=$('#budget'),photos=$('#photo-album'),activities=$('#activities'),stays=$('#hotels');let cursor=money;for(const section of [photos,activities,stays])if(section){cursor.after(section);cursor=section}}renderRoute();renderHotels()}
let dayObserver,stickyResizeObserver,observedDatebar,stickyFrame=0,lastStickyOffset=0;
function syncStickyMetrics(){const header=$('.topbar'),dates=$('.datebar');const headerHeight=Math.ceil(header?header.getBoundingClientRect().height:0),dateHeight=Math.ceil(dates?dates.getBoundingClientRect().height:0);const root=document.documentElement;root.style.setProperty('--header-height',headerHeight+'px');root.style.setProperty('--datebar-height',dateHeight+'px');const offset=headerHeight+dateHeight+14;const changed=offset!==lastStickyOffset;lastStickyOffset=offset;if('ResizeObserver' in window){if(!stickyResizeObserver){stickyResizeObserver=new ResizeObserver(()=>scheduleStickyLayout());if(header)stickyResizeObserver.observe(header)}if(dates!==observedDatebar){if(observedDatebar)stickyResizeObserver.unobserve(observedDatebar);observedDatebar=dates;if(dates)stickyResizeObserver.observe(dates)}}return changed}
function scheduleStickyLayout(){if(stickyFrame)return;stickyFrame=requestAnimationFrame(()=>{stickyFrame=0;if(syncStickyMetrics())observeDays()})}
function observeDays(){syncStickyMetrics();if(dayObserver)dayObserver.disconnect();if(!('IntersectionObserver' in window))return;dayObserver=new IntersectionObserver(entries=>{for(const e of entries)if(e.isIntersecting){document.querySelectorAll('.date-link').forEach(a=>a.classList.toggle('active',a.dataset.navDay===e.target.dataset.day))}},{rootMargin:'-'+lastStickyOffset+'px 0px -55% 0px',threshold:0});document.querySelectorAll('[data-day]').forEach(e=>dayObserver.observe(e));scheduleStickyLayout()}
window.addEventListener('resize',scheduleStickyLayout,{passive:true});window.addEventListener('orientationchange',scheduleStickyLayout,{passive:true});if(document.fonts&&document.fonts.ready)document.fonts.ready.then(scheduleStickyLayout);
document.addEventListener('click',e=>{const filter=e.target.closest('[data-photo-filter]');if(filter){setPhotoFilter(filter.dataset.photoFilter);return}const scroll=e.target.closest('[data-photo-scroll]');if(scroll){const group=document.querySelector('[data-photo-scope='+scroll.dataset.photoGroup+'] .photo-grid');if(group){const first=group.querySelector('.photo-card');group.scrollBy({left:Number(scroll.dataset.photoScroll)*((first?first.getBoundingClientRect().width:group.clientWidth)+16),behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}return}const b=e.target.closest('[data-route]');if(b){routeId=b.dataset.route;save('route',routeId);renderRoute();return}});
document.addEventListener('change',e=>{if(e.target.id==='city-filter'){cityFilter=e.target.value;save('city',cityFilter);renderHotels()}if(e.target.id==='bed-filter'){bedFilter=e.target.value;save('bed',bedFilter);renderHotels()}});
document.addEventListener('input',e=>{if(e.target.id==='exchange-rate'){const value=Number(e.target.value);if(value>0&&value<=100){rate=value;save('rate',rate);renderBudget();renderHotels();refreshActivityPrices();const r=routes.find(x=>x.id===routeId)||routes[0];const rentals=$('#route-detail .route-rentals');if(rentals)rentals.outerHTML=renderRentals(r);$('#day-list').innerHTML=arr(r.days).map((d,i)=>dayCard(d,i,r)).join('');observeDays()}}});
$('#lang-zh').addEventListener('click',()=>{language='zh';save('language',language);render()});$('#lang-both').addEventListener('click',()=>{language='both';save('language',language);render()});$('#print-button').addEventListener('click',()=>window.print());
let printOpen=[];window.addEventListener('beforeprint',()=>{printOpen=[...document.querySelectorAll('details')].map(d=>[d,d.open]);printOpen.forEach(([d])=>d.open=true)});window.addEventListener('afterprint',()=>printOpen.forEach(([d,o])=>d.open=o));
render();
</script>
