<script>
'use strict';
const DATA=JSON.parse(document.getElementById('itinerary-data').textContent);
const $=s=>document.querySelector(s);
const arr=x=>Array.isArray(x)?x:(x===undefined||x===null||x===''?[]:[x]);
const plain=x=>x&&typeof x==='object'&&!Array.isArray(x)?String(x.zh??x.en??''):String(x??'');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=x=>{try{const u=new URL(String(x));return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}};
const getSaved=(k,d)=>{try{return localStorage.getItem('nz-itinerary-'+k)??d}catch{return d}};
const save=(k,v)=>{try{localStorage.setItem('nz-itinerary-'+k,String(v))}catch{}};
const meta=DATA.meta||{},budget=DATA.budget||{},routes=DATA.routes||[],hotels=DATA.hotels||[];
const travelers=Number(budget.travelers)>0?Number(budget.travelers):3;
let language=getSaved('language','zh');if(!['zh','both'].includes(language))language='zh';
const defaultRoute=routes.some(r=>r.id===meta.defaultRoute)?meta.defaultRoute:routes[0].id;
let routeId=getSaved('route',defaultRoute);if(!routes.some(r=>r.id===routeId))routeId=defaultRoute;
let rate=Number(meta.currentPlan?(budget.exchangeRate||3.8):getSaved('rate',budget.exchangeRate||3.8));if(!(rate>0))rate=3.8;
let cityFilter=getSaved('city','all'),bedFilter=getSaved('bed','all');
const hotelMap=new Map(hotels.map(h=>[String(h.id),h]));
const landmarkMap=new Map(arr(DATA.landmarkPins).filter(p=>p&&typeof p==='object').map(p=>[String(p.id),p]));
const fixed=(zh,en)=>language==='both'?`${esc(zh)}<span class="en">${esc(en)}</span>`:esc(zh);
function text(x){if(x===undefined||x===null)return '';if(typeof x==='object'&&!Array.isArray(x)){const zh=String(x.zh??x.en??''),en=String(x.en??'');return esc(zh)+(language==='both'&&en&&en!==zh?`<span class="en">${esc(en)}</span>`:'')}return esc(x)}
const present=x=>plain(x).trim()!=='';
function link(url,label,cls=''){const safe=safeUrl(url);return safe?`<a href="${esc(safe)}" target="_blank" rel="noopener noreferrer"${cls?` class="${esc(cls)}"`:''}>${label}<span aria-hidden="true"> ↗</span></a>`:label}
const list=(xs,cls)=>arr(xs).length?`<ul class="${cls||''}">${arr(xs).map(x=>`<li>${text(x)}</li>`).join('')}</ul>`:'';
const currency=c=>String(c||'NZD').toUpperCase()==='RMB'?'CNY':String(c||'NZD').toUpperCase();
const num=(n,d=0)=>Number(n).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d});
const amount=(n,c)=>`${currency(c)} ${num(n,meta.currentPlan?2:Number(n)%1?2:0)}`;
function cny(n,c){c=currency(c);if(c==='CNY')return Number(n);if(c==='NZD')return Number(n)*rate;const r=Number((budget.exchangeRates||{})[c]);return r>0?Number(n)*r:null}
function approx(n,c){const v=cny(n,c);return v===null||currency(c)==='CNY'?'':`≈ ¥${num(v)}`}
function dateLabel(s){const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${Number(m[2])}/${Number(m[3])}`:String(s||'')}
function weekday(s){const d=new Date(String(s)+'T12:00:00Z');return Number.isNaN(d.valueOf())?'':['周日','周一','周二','周三','周四','周五','周六'][d.getUTCDay()]}
function nights(q){if(q.nights!==undefined)return q.nights;const a=Date.parse(q.checkIn),b=Date.parse(q.checkOut);return Number.isFinite(a)&&Number.isFinite(b)&&b>a?Math.round((b-a)/86400000):null}
const mapsSearch=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);

function quoteAvailability(q){
 const a=q.availability,raw=typeof a==='object'&&a?a.status:typeof a==='string'?a:q.inventoryStatus||q.status;
 const v=String(raw||'unverified').toLowerCase().replace(/-/g,'_'),reason=q.availabilityReason||(typeof a==='object'&&a?a.reason:'');
 const restriction=['minimum_stay','room_mismatch','occupancy_limit','maximum_stay','closed_to_arrival','closed_to_departure','rate_restriction'].includes(reason);
 const status=restriction||v==='unavailable'?'unavailable':['available','live','limited','confirmed'].includes(v)?'available':['sold_out','soldout','no_availability'].includes(v)?'sold_out':'unverified';
 const label=(q.bookingStatus==='confirmed'||v==='confirmed')?{zh:'订单已确认',en:'Booking confirmed'}:typeof a==='object'&&a?a.label:q.availabilityLabel||q.statusLabel;
 return {status,label,reason};

 else if(a.reason==='occupancy_limit')special=fixed('该入住人数组合不可订','This guest-count combination cannot be booked');

function isoDate(x){return /^\d{4}-\d{2}-\d{2}$/.test(String(x||''))?String(x):''}
function nextDate(x){const d=new Date(x+'T12:00:00Z');if(Number.isNaN(d.valueOf()))return '';d.setUTCDate(d.getUTCDate()+1);return d.toISOString().slice(0,10)}
function hotelStay(r,index,hotelId){const ds=arr(r.days),has=i=>arr(ds[i]&&ds[i].hotelIds).some(id=>String(id)===String(hotelId));let first=index,last=index;while(first>0&&has(first-1)&&nextDate(ds[first-1].date)===ds[first].date)first--;while(last+1<ds.length&&has(last+1)&&nextDate(ds[last].date)===ds[last+1].date)last++;const checkIn=isoDate(ds[first].date),checkOut=nextDate(ds[last].date),n=checkIn&&checkOut?Math.round((Date.parse(checkOut)-Date.parse(checkIn))/86400000):last-first+1;return {checkIn,checkOut,nights:n,first,last,repeat:index>first};}
function matchingQuotes(h,r,stay){return arr(h.quotes).filter(q=>{const ids=q.routeId!==undefined?arr(q.routeId):arr(q.routeIds);return (!ids.length||ids.map(String).includes(String(r.id)))&&isoDate(q.checkIn)===stay.checkIn&&isoDate(q.checkOut)===stay.checkOut;});}

 const entries=arr(d.hotelIds).map(id=>hotelMap.get(String(id))).filter(Boolean),available=[],unavailable=[],unknown=[],comfort=[],listed=[],alternate=[];
 for(const h of entries){const qs=matchingQuotes(h,r,hotelStay(r,index,h.id));if(h.routeAlternativeOnly){alternate.push(h);continue}if(qs.some(q=>quoteAvailability(q).status==='available'&&isRealDateQuote(q)))available.push(h);else if(qs.length&&qs.every(q=>['sold_out','unavailable'].includes(quoteAvailability(q).status)))unavailable.push(h);else if(h.listQuoteShortlist&&qs.some(q=>isRealDateQuote(q)))listed.push(h);else if(h.comfortShortlist)comfort.push(h);else unknown.push(h);}
 const cards=hs=>hs.map(h=>dailyHotel(h,d,index,r)).join('');

function landmarkUrl(value){
 const safe=safeUrl(value);if(!safe)return '';
 try{const u=new URL(safe);if(u.username||u.password)return '';if(/(^|\.)xiaohongshu\.com$|(^|\.)xhslink\.com$/i.test(u.hostname)){u.search='';u.hash='';}else{for(const key of [...u.searchParams.keys()]){if(/token|secret|authorization|signature|session|password|credential|^(sid|key|api_key|auth|code)$/i.test(key))u.searchParams.delete(key);}}return u.href;}catch{return '';}
}
function landmarkLink(url,label,cls=''){return link(landmarkUrl(url),label,cls)}

 const complete=[stay,domestic,international,rental].every(x=>x!==null),total=complete?stay+domestic+international+rental:null;
 const per=budget.internationalPerPersonCny||{};const rows=[['六晚住宿',stay,'皇后镇2晚＋Tekapo2晚＋基督城1晚＋奥克兰1晚'],['新西兰境内两段机票',domestic,'三人两段合计'],['国际往返机票',international,'北京两人＋上海一人'],['Apex租车',rental,'NZ$ '+num(rentalNzd,2)+'，取车时付款']];
 return `<section class="b-core-budget" id="current-core-budget"><div class="budget-totals"><div class="total-card primary"><div class="total-label">${fixed('机票、住宿与租车 / 平均每人','Flights, stays and car / average per person')}</div><strong>${total===null?'': '≈ '}${money(total===null?null:total/travelers)}</strong><small>${fixed('三人合计','Group total')} ${money(total)}</small></div><div class="total-card"><div class="total-label">${fixed('住宿已付','Accommodation paid')}</div><strong>${money(val(budget.paidVerifiedCny))}</strong><small>${fixed('四段六晚住宿已全部付清','All four stays / six nights paid in full')}</small></div><div class="total-card"><div class="total-label">${fixed('住宿待付','Accommodation unpaid')}</div><strong>${money(val(budget.scheduledPaymentCny))}</strong><small>${fixed('全部付清，无剩余待付','Paid in full; no outstanding accommodation')}</small></div></div><div class="trip-cost-rows">${rows.map(([name,value,note])=>`<div class="trip-cost-row"><div><strong>${text(name)}</strong><small>${text(note)}</small></div><strong>${money(value)}</strong></div>`).join('')}</div><p class="fine">${fixed('国际机票：北京每人','International tickets: Beijing / person ')} ${money(val(per.Beijing))} · ${fixed('上海','Shanghai ')} ${money(val(per.Shanghai))}。${fixed('共同费用按三人均分展示。','Shared costs are divided equally among three.')}</p><p class="fine">${fixed('住宿已全部付清；租车仍在取车时付款。餐饮、油费停车、保险与机场交通等另算。租车人民币为参考折算，最终以实际结算为准。','Accommodation is paid in full; pay the car rental at pick-up. Meals, fuel/parking, insurance and airport transfers are separate. The CNY car figure is a reference conversion; final settlement may differ.')}</p></section>${arr(budget.allowances).length?`<details class="trip-allowances"><summary>${fixed('餐饮、油费与其他预留','Meals, fuel and other allowances')}</summary><p class="fine">${fixed('以下是预留，不计入上方小计。','Allowances below are excluded from the subtotal above.')}</p>${budgetRows(budget.allowances)}</details>`:''}`;
}
function renderCurrentPage(){
 $('#app').innerHTML=`<section class="hero"><div class="eyebrow">NEW ZEALAND / SUMMER 2026–27</div><h1>${text(meta.title)}</h1><p class="subtitle">${text(meta.subtitle)}</p><div class="meta-line"><span>${text(meta.dateRange)}</span><span>${text(meta.travelers)}</span></div><div class="facts">${arr(meta.heroFacts).map(f=>`<span class="pill">${text(f)}</span>`).join('')}</div><p class="lead">${text(meta.intro)}</p><div class="trip-hero-actions"><a class="link-button booking-primary" href="#itinerary">${fixed('查看每日行程 ↓','View the daily itinerary ↓')}</a><a class="link-button" href="drive.html">${fixed('开车导航专页 ↗','Dedicated driving guide ↗')}</a></div></section><section class="section" id="itinerary"><div class="section-heading"><div><div class="section-kicker">THE ROADBOOK</div><h2>${fixed('每天怎么玩，路上在哪停','What to see each day and along the way')}</h2><p class="section-caption">${fixed('按顺序列出沿途看点、建议停留、吃饭休息与到达后的安排。新西兰段均为当地时间；详细驾驶与停车见开车导航。','Sights, suggested visits, meal breaks and plans after arrival, in order. New Zealand times are local; use the driving guide for detailed driving and parking.')}</p></div></div><div class="route-switch" id="route-buttons"></div><div id="route-detail"></div><div class="print-route" id="print-route"></div><nav class="datebar" aria-label="日期导航"><div class="datebar-inner" id="date-links"></div></nav><div class="day-list" id="day-list"></div></section>${renderCompactFlights()}<section class="section" id="budget"><div class="section-heading"><div><div class="section-kicker">TRIP COSTS</div><h2>${fixed('费用与付款安排','Costs and payment arrangements')}</h2></div></div><div id="budget-content"></div></section>${renderPhotoAlbum()}<footer class="footer">${fixed('按天气与体力调整节奏。出发前确认航班、道路和门店营业，停车与逐站路线请打开开车导航。','Adjust the pace for weather and energy. Confirm flights, road conditions and opening times before departure; use the driving guide for parking and each stop.')}</footer><a class="jump-top" href="#top">${fixed('回到顶部 ↑','Back to top ↑')}</a>`;
 $('#lang-zh').classList.toggle('active',language==='zh');$('#lang-both').classList.toggle('active',language==='both');$('#lang-zh').setAttribute('aria-pressed',String(language==='zh'));$('#lang-both').setAttribute('aria-pressed',String(language==='both'));renderCompactRoute();
}

function renderLegacy(){const title=meta.title||{zh:'新西兰 · 南岛自驾',en:'New Zealand · South Island road trip'};$('#app').innerHTML=`<section class="hero"><div class="hero-top"><div><div class="eyebrow">${text(meta.planVersion||'A SOUTH ISLAND JOURNEY')}</div><h1>${text(title)}</h1></div><span class="status-pill">${text(meta.statusNote||{zh:'规划草案 · 请核对预订状态',en:'Planning draft · check booking status'})}</span></div><p class="subtitle">${text(meta.subtitle||{zh:'三位女生，慢慢开、好好看。',en:'A considered road trip for three.'})}</p><div class="meta-line">${meta.dateRange?`<span>${text(meta.dateRange)}</span>`:''}<span>${text(meta.travelers||`${travelers} 人同行`)}</span>${meta.updatedAt?`<span>${fixed('更新','Updated')} · ${text(meta.updatedAt)}</span>`:''}</div>${meta.heroFacts?`<div class="facts">${arr(meta.heroFacts).map(f=>`<span class="pill">${text(f)}</span>`).join('')}</div>`:''}${meta.partyNote?`<div class="party-note">${text(meta.partyNote)}</div>`:''}${meta.intro?`<p class="lead">${text(meta.intro)}</p>`:''}${meta.recommendation?`<div class="recommendation">${meta.recommendation.title?`<strong>${text(meta.recommendation.title)}</strong>`:''}${meta.recommendation.detail?`<p>${text(meta.recommendation.detail)}</p>`:''}</div>`:''}${list(meta.notes,'note-list')}${arr(meta.platformCoverage).length?`<div class="platform-coverage">${arr(meta.platformCoverage).map(p=>`<div><strong>${text(p.name)}</strong><p>${text(p.detail)}</p></div>`).join('')}</div>`:''}</section>${renderFlights()}${meta.seasonNote?`<aside class="season-note"><strong>${fixed('跨年夏季怎么安排','Planning for midsummer and New Year')}</strong><p>${text(meta.seasonNote)}</p></aside>`:''}${arr(meta.assumptions).length?`<aside class="assumptions"><strong>${fixed('目前按这些假设规划','Working assumptions')}</strong>${list(meta.assumptions)}</aside>`:''}${renderPhotoAlbum()}<section class="section" id="itinerary"><div class="section-heading"><div><div class="section-kicker">THE ROADBOOK</div><h2>${fixed('每天怎么走，一页看清','The daily roadbook')}</h2><p class="section-caption">${meta.currentPlan?fixed('按已确认住宿顺序走；参考时刻默认收起。','Follow the confirmed stay order; reference times stay collapsed.'):fixed('切换方案可比较动线；参考时刻默认收起。','Switch routes to compare the plan; reference times stay collapsed.')}</p></div></div><div class="route-switch" id="route-buttons" role="group" aria-label="路线方案"></div><div id="route-detail"></div><div class="print-route" id="print-route"></div><nav class="datebar" aria-label="日期导航"><div class="datebar-inner" id="date-links"></div></nav><div class="day-list" id="day-list"></div></section><section class="section" id="hotels"><div class="section-heading"><div><div class="section-kicker">STAY SHORTLIST</div><h2>${fixed('住宿房型资料库','Accommodation reference')}</h2><p class="section-caption">${meta.currentPlan?fixed('每天已直接列出对应住宿；这里集中保留房型、付款与入住提醒。','Each daily card shows the stay; room, payment and check-in notes are collected here.'):fixed('每天已直接列出对应日期的酒店与订房入口；这里保留全部房型依据，供需要时参考。','Daily cards already show dated stays and booking links. This appendix preserves the full room references.')}</p></div></div><details class="hotel-appendix"><summary>${fixed('展开所有住宿与房型依据','Open all hotel and room references')}</summary><div class="filters" style="margin-top:16px"><label class="field-label">${fixed('城市','City')}<select id="city-filter" aria-label="按城市筛选"></select></label><label class="field-label">${fixed('床型','Bed setup')}<select id="bed-filter" aria-label="按床型筛选"></select></label></div><p class="hotel-count" id="hotel-count" aria-live="polite"></p><div class="hotel-grid" id="hotel-grid"></div></details></section><section class="section" id="budget"><div class="section-heading"><div><div class="section-kicker">THE MONEY PLAN</div><h2>${fixed('费用说清楚，花钱有顺序','A transparent spending plan')}</h2><p class="section-caption">${meta.currentPlan?fixed('已核原件金额、付款安排与其他预留分开列；租车按可调汇率换算。','Verified document amounts, payment arrangements and other allowances are separate; car costs use the adjustable exchange rate.'):fixed('已观察报价与规划估算分开；合计仅包含下列项目。','Observed quotes and estimates are separate; totals include only the items listed.')}</p></div></div>${meta.budgetHeadline?`<p class="budget-headline">${text(meta.budgetHeadline)}</p>`:''}<div class="budget-control"><label class="rate-input">1 NZD = <input id="exchange-rate" type="number" inputmode="decimal" min="0.01" max="100" step="0.0001" value="${esc(rate)}" aria-label="新西兰元兑人民币规划汇率"> CNY</label><p>${text(meta.currencyNote||{zh:'这是可调整的规划汇率假设，不是实时结算汇率。修改后同步换算酒店与预算。',en:'An adjustable planning assumption, not a live settlement rate. Hotel and budget equivalents update together.'})}</p></div>${budget.note?`<p class="block-note">${text(budget.note)}</p>`:''}<div id="budget-content" aria-live="polite"></div></section>${arr(meta.bookingPriority).length?`<section class="section" id="next-steps"><div class="section-heading"><div><div class="section-kicker">BOOKING ORDER</div><h2>${fixed('接下来，按这个顺序确认','What to confirm next')}</h2></div></div><ol class="priority-list">${arr(meta.bookingPriority).map(p=>`<li><span>${text(p)}</span></li>`).join('')}</ol></section>`:''}${sources()}<footer class="footer">${text(meta.footerNote||{zh:'当前为旅行规划；预订前复核日期、人数、床型、税费与退改。',en:'A planning document. Recheck dates, guests, beds, taxes and cancellation before booking.'})}</footer><a class="jump-top" href="#top">${fixed('回到顶部 ↑','Back to top ↑')}</a>`;$('#lang-zh').classList.toggle('active',language==='zh');$('#lang-both').classList.toggle('active',language==='both');$('#lang-zh').setAttribute('aria-pressed',String(language==='zh'));$('#lang-both').setAttribute('aria-pressed',String(language==='both'));if(meta.currentPlan){const money=$('#budget'),photos=$('#photo-album'),stays=$('#hotels');let cursor=money;for(const section of [photos,stays])if(section){cursor.after(section);cursor=section}}renderRoute();renderHotels()}
function render(){return meta.currentPlan?renderCurrentPage():renderLegacy()}
let dayObserver,stickyResizeObserver,observedDatebar,stickyFrame=0,lastStickyOffset=0;
function syncStickyMetrics(){const header=$('.topbar'),dates=$('.datebar');const headerHeight=Math.ceil(header?header.getBoundingClientRect().height:0),dateHeight=Math.ceil(dates?dates.getBoundingClientRect().height:0);const root=document.documentElement;root.style.setProperty('--header-height',headerHeight+'px');root.style.setProperty('--datebar-height',dateHeight+'px');const offset=headerHeight+dateHeight+14;const changed=offset!==lastStickyOffset;lastStickyOffset=offset;if('ResizeObserver' in window){if(!stickyResizeObserver){stickyResizeObserver=new ResizeObserver(()=>scheduleStickyLayout());if(header)stickyResizeObserver.observe(header)}if(dates!==observedDatebar){if(observedDatebar)stickyResizeObserver.unobserve(observedDatebar);observedDatebar=dates;if(dates)stickyResizeObserver.observe(dates)}}return changed}
function scheduleStickyLayout(){if(stickyFrame)return;stickyFrame=requestAnimationFrame(()=>{stickyFrame=0;if(syncStickyMetrics())observeDays()})}
function observeDays(){syncStickyMetrics();if(dayObserver)dayObserver.disconnect();if(!('IntersectionObserver' in window))return;dayObserver=new IntersectionObserver(entries=>{for(const e of entries)if(e.isIntersecting){document.querySelectorAll('.date-link').forEach(a=>a.classList.toggle('active',a.dataset.navDay===e.target.dataset.day))}},{rootMargin:'-'+lastStickyOffset+'px 0px -55% 0px',threshold:0});document.querySelectorAll('[data-day]').forEach(e=>dayObserver.observe(e));scheduleStickyLayout()}
window.addEventListener('resize',scheduleStickyLayout,{passive:true});window.addEventListener('orientationchange',scheduleStickyLayout,{passive:true});if(document.fonts&&document.fonts.ready)document.fonts.ready.then(scheduleStickyLayout);
document.addEventListener('click',e=>{const filter=e.target.closest('[data-photo-filter]');if(filter){setPhotoFilter(filter.dataset.photoFilter);return}const scroll=e.target.closest('[data-photo-scroll]');if(scroll){const group=document.querySelector('[data-photo-scope='+scroll.dataset.photoGroup+'] .photo-grid');if(group){const first=group.querySelector('.photo-card');group.scrollBy({left:Number(scroll.dataset.photoScroll)*((first?first.getBoundingClientRect().width:group.clientWidth)+16),behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}return}const b=e.target.closest('[data-route]');if(b){routeId=b.dataset.route;save('route',routeId);renderRoute();return}});
document.addEventListener('change',e=>{if(e.target.id==='city-filter'){cityFilter=e.target.value;save('city',cityFilter);renderHotels()}if(e.target.id==='bed-filter'){bedFilter=e.target.value;save('bed',bedFilter);renderHotels()}});
document.addEventListener('input',e=>{if(e.target.id==='exchange-rate'){const value=Number(e.target.value);if(value>0&&value<=100){rate=value;save('rate',rate);renderBudget();renderHotels();const r=routes.find(x=>x.id===routeId)||routes[0];const rentals=$('#route-detail .route-rentals');if(rentals)rentals.outerHTML=renderRentals(r);$('#day-list').innerHTML=arr(r.days).map((d,i)=>dayCard(d,i,r)).join('');observeDays()}}});
$('#lang-zh').addEventListener('click',()=>{language='zh';save('language',language);render()});$('#lang-both').addEventListener('click',()=>{language='both';save('language',language);render()});$('#print-button').addEventListener('click',()=>window.print());
let printOpen=[];window.addEventListener('beforeprint',()=>{printOpen=[...document.querySelectorAll('details')].map(d=>[d,d.open]);printOpen.forEach(([d])=>d.open=true)});window.addEventListener('afterprint',()=>printOpen.forEach(([d,o])=>d.open=o));
render();
